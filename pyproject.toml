[project]
name = "study-data-platform-import"
version = "0.1.0"
description = "Study repository for importing local files into Databricks, Snowflake, Redshift, and BigQuery."
requires-python = ">=3.10"
dependencies = [
  "databricks-connect>=15.4",
  "pandas>=2.2",
  "pyarrow>=16.0",
]

[project.scripts]
databricks-import = "study_data_platform_import.databricks.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
